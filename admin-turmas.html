<!doctype html>
<html lang="pt-BR" data-pagina="admin-turmas" data-papel="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turmas | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-6xl mx-auto">
    <p class="text-xs font-bold tracking-[1.5px] text-ps-texto dark:text-ps-claro">ADMINISTRAÇÃO</p>
    <div class="mt-1 flex flex-wrap items-center gap-3">
      <h1 class="text-2xl sm:text-3xl font-extrabold mr-auto">Turmas</h1>
      <a href="index.html#criar" class="h-11 px-5 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro inline-flex items-center gap-2 hover:brightness-105"><span x-html="ic('mais', '!w-4 !h-4')"></span>Criar turma</a>
    </div>

    <div class="mt-5 flex gap-1 border-b border-ps-linha dark:border-ps-noite3" role="tablist" aria-label="Situação">
      <template x-for="a in ['Ativas', 'Arquivadas', 'Todas']" :key="a">
        <button type="button" role="tab" @click="aba = a" :aria-selected="(aba === a).toString()" class="h-12 px-4 text-sm font-semibold border-b-[3px] -mb-px"
                :class="aba === a ? 'border-ps-azul text-ps-texto dark:text-ps-claro' : 'border-transparent text-ps-cinza dark:text-slate-400 hover:text-ps-escuro dark:hover:text-white'">
          <span x-text="a"></span> <span class="text-xs" x-text="'(' + filtrar(a).length + ')'"></span>
        </button>
      </template>
    </div>

    <div class="mt-4 grid gap-4 md:grid-cols-2">
      <template x-for="t in filtrar(aba)" :key="t.id">
        <article class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 overflow-hidden" :class="t.arquivada && 'opacity-75'">
          <div class="flex items-stretch">
            <span class="w-2 shrink-0" :style="'background:' + t.cor"></span>
            <div class="flex-1 p-5 min-w-0">
              <div class="flex items-start gap-3">
                <div class="flex-1 min-w-0">
                  <a :href="'turma.html?t=' + t.id" class="block text-lg font-bold truncate hover:underline" x-text="t.nome"></a>
                  <p class="text-sm text-ps-cinza dark:text-slate-400 truncate" x-text="t.secao + ' · ' + t.instrutor"></p>
                </div>
                <span class="shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full" :class="t.arquivada ? 'bg-ps-fundo text-ps-cinza dark:bg-ps-noite3 dark:text-slate-400' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300'" x-text="t.arquivada ? 'Arquivada' : 'Ativa'"></span>
              </div>
              <dl class="mt-4 grid grid-cols-3 gap-2 text-center">
                <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 py-2"><dt class="text-[11px] text-ps-cinza dark:text-slate-400">Atividades</dt><dd class="font-extrabold tabular-nums" x-text="$store.ps.itens(t).length"></dd></div>
                <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 py-2"><dt class="text-[11px] text-ps-cinza dark:text-slate-400">Tópicos</dt><dd class="font-extrabold tabular-nums" x-text="t.topicos.length"></dd></div>
                <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 py-2"><dt class="text-[11px] text-ps-cinza dark:text-slate-400">Código</dt><dd class="font-extrabold truncate px-1" x-text="t.codigo"></dd></div>
              </dl>
              <div class="mt-4 flex flex-wrap gap-2">
                <a :href="'turma-config.html?t=' + t.id" class="h-10 px-4 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('editar', '!w-4 !h-4')"></span>Editar</a>
                <a :href="'desempenho.html?t=' + t.id" class="h-10 px-4 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('grafico', '!w-4 !h-4')"></span>Desempenho</a>
                <button type="button" @click="arquivar(t)" class="h-10 px-4 rounded-full text-sm font-semibold inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3" :class="t.arquivada ? 'text-ps-texto dark:text-ps-claro' : 'text-red-700 dark:text-red-400'">
                  <span x-html="ic('caixa', '!w-4 !h-4')"></span><span x-text="t.arquivada ? 'Restaurar' : 'Arquivar'"></span>
                </button>
              </div>
            </div>
          </div>
        </article>
      </template>
    </div>
    <p x-show="filtrar(aba).length === 0" class="mt-10 text-center text-sm text-ps-cinza dark:text-slate-400">Nenhuma turma aqui.</p>
  </div>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      aba: 'Ativas',
      init() { this.$store.ps.titulo = 'Turmas'; },
      filtrar(a) {
        return this.$store.ps.turmas(true).filter(function (t) { return a === 'Todas' || (a === 'Ativas' ? !t.arquivada : t.arquivada); });
      },
      arquivar(t) {
        if (!t.arquivada && !confirm('Arquivar a turma "' + t.nome + '"?')) return;
        this.$store.ps.arquivar(t.id, !t.arquivada);
      }
    };
  }
</script>
</body>
</html>
