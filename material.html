<!doctype html>
<html lang="pt-BR" data-pagina="material">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
<template x-if="achado">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-7xl mx-auto">
    <nav class="flex flex-wrap items-center gap-1 text-sm text-ps-cinza dark:text-slate-400" aria-label="Você está em">
      <a :href="'turma.html?t=' + achado.turma.id + '&aba=atividades'" class="inline-flex items-center min-h-[44px] font-semibold text-ps-texto dark:text-ps-claro hover:underline" x-text="achado.turma.nome"></a>
      <span x-html="ic('direita', '!w-4 !h-4')"></span>
      <span x-text="achado.topico.nome"></span>
    </nav>

    <div class="mt-3 grid gap-6 xl:grid-cols-[minmax(0,1fr)_320px] items-start">

      <!-- ================= Visualizador ================= -->
      <article class="min-w-0">
        <div class="relative aspect-[16/9] rounded-2xl overflow-hidden bg-ps-escuro text-white flex flex-col items-center justify-center gap-4 p-6 text-center">
          <svg class="banner-deco" viewBox="0 0 800 450" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
            <circle cx="720" cy="60" r="180" fill="none" stroke="#53CCF5" stroke-width="3"/>
            <circle cx="720" cy="60" r="110" fill="none" stroke="#53CCF5" stroke-width="3"/>
            <path d="M480 450 L620 270 L760 450 Z" fill="#00AFE3"/>
          </svg>
          <span class="relative h-16 w-16 rounded-2xl bg-white/10 text-ps-claro inline-flex items-center justify-center" x-html="ic('arquivo', '!w-8 !h-8')"></span>
          <p class="relative text-lg sm:text-2xl font-extrabold" x-text="item.titulo"></p>
          <p class="relative text-sm text-slate-300">[PDF ou vídeo do material]</p>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row sm:items-start gap-4">
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold tracking-[1.5px] text-ps-texto dark:text-ps-claro">MATERIAL</p>
            <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold leading-tight" x-text="item.titulo"></h1>
            <p class="mt-1 text-sm text-ps-cinza dark:text-slate-400" x-text="achado.turma.instrutor"></p>
          </div>
          <button type="button" @click="$store.ps.alternarVisto(item.id)"
                  class="shrink-0 h-12 px-6 rounded-full text-sm font-bold inline-flex items-center justify-center gap-2"
                  :class="$store.ps.feitos[item.id] ? 'border border-emerald-600 text-emerald-700 dark:border-emerald-400 dark:text-emerald-400' : 'bg-ps-azul text-ps-escuro hover:brightness-105'"
                  :aria-pressed="(!!$store.ps.feitos[item.id]).toString()">
            <span x-html="ic($store.ps.feitos[item.id] ? 'checkCirculo' : 'check', '!w-5 !h-5')"></span>
            <span x-text="$store.ps.feitos[item.id] ? 'Visto' : 'Marcar como visto'"></span>
          </button>
        </div>

        <p class="mt-6 text-[15px] leading-8 whitespace-pre-line" x-text="item.descricao"></p>

        <a href="#" @click.prevent="$store.ps.avisar('Demo: o link do material ainda não foi definido.')" class="mt-6 inline-flex items-center gap-3 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-3 pr-5 hover:border-ps-azul">
          <span class="h-11 w-11 rounded-lg bg-ps-suave dark:bg-ps-noite3 text-ps-texto dark:text-ps-claro inline-flex items-center justify-center" x-html="ic('arquivo')"></span>
          <span><span class="block text-sm font-semibold" x-text="item.titulo + ' (PDF)'"></span><span class="block text-xs text-ps-cinza dark:text-slate-400">[link do material]</span></span>
        </a>

        <!-- Anterior / próximo -->
        <div class="mt-10 pt-6 border-t border-ps-linha dark:border-ps-noite3 grid grid-cols-2 gap-3">
          <div>
            <template x-if="vizinho(-1)">
              <a :href="$store.ps.urlItem(achado.turma.id, vizinho(-1))" class="flex flex-col gap-1 rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-4 hover:border-ps-azul">
                <span class="inline-flex items-center gap-1 text-xs font-semibold text-ps-cinza dark:text-slate-400"><span x-html="ic('esquerda', '!w-4 !h-4')"></span>Anterior</span>
                <span class="text-sm font-semibold truncate" x-text="vizinho(-1).titulo"></span>
              </a>
            </template>
          </div>
          <div>
            <template x-if="vizinho(1)">
              <a :href="$store.ps.urlItem(achado.turma.id, vizinho(1))" class="flex flex-col items-end gap-1 text-right rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-4 hover:border-ps-azul">
                <span class="inline-flex items-center gap-1 text-xs font-semibold text-ps-cinza dark:text-slate-400">Próximo<span x-html="ic('direita', '!w-4 !h-4')"></span></span>
                <span class="text-sm font-semibold truncate max-w-full" x-text="vizinho(1).titulo"></span>
              </a>
            </template>
          </div>
        </div>
      </article>

      <!-- ================= Conteúdo da turma ================= -->
      <aside class="xl:sticky xl:top-24 rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 overflow-hidden" aria-labelledby="t-cont">
        <div class="p-5 border-b border-ps-linha dark:border-ps-noite3">
          <h2 id="t-cont" class="font-bold">Conteúdo da turma</h2>
          <div class="mt-3 flex items-center gap-3">
            <div class="flex-1 h-2 rounded-full bg-ps-fundo dark:bg-ps-noite3 overflow-hidden" role="progressbar" :aria-valuenow="$store.ps.progresso(achado.turma)" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso na turma">
              <div class="h-full rounded-full bg-ps-azul" :style="'width:' + $store.ps.progresso(achado.turma) + '%'"></div>
            </div>
            <span class="text-xs font-semibold text-ps-cinza dark:text-slate-400" x-text="$store.ps.progresso(achado.turma) + '%'"></span>
          </div>
        </div>
        <div class="max-h-[60vh] overflow-y-auto py-2">
          <template x-for="tp in achado.turma.topicos" :key="tp.nome">
            <div class="py-2">
              <p class="px-5 py-1 text-xs font-bold tracking-wider text-ps-cinza dark:text-slate-400" x-text="tp.nome.toUpperCase()"></p>
              <template x-for="it in tp.itens" :key="it.id">
                <a :href="$store.ps.urlItem(achado.turma.id, it)" class="flex items-center gap-3 px-5 py-2.5 text-sm"
                   :class="it.id === item.id ? 'bg-ps-suave dark:bg-ps-noite3 font-semibold' : 'hover:bg-ps-fundo dark:hover:bg-ps-noite3'"
                   :aria-current="it.id === item.id ? 'page' : null">
                  <span class="h-6 w-6 rounded-full inline-flex items-center justify-center shrink-0"
                        :class="$store.ps.concluido(it) ? 'bg-emerald-600 text-white' : 'border-2 border-ps-linha dark:border-ps-noite3'"
                        x-html="$store.ps.concluido(it) ? ic('check', '!w-3.5 !h-3.5') : ''"></span>
                  <span class="flex-1 min-w-0 truncate" x-text="it.titulo"></span>
                  <span class="text-ps-cinza dark:text-slate-400" x-html="ic(it.tipo, '!w-4 !h-4')"></span>
                </a>
              </template>
            </div>
          </template>
        </div>
      </aside>
    </div>
  </div>
</template>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      id: param('id'),
      get achado() { return this.$store.ps.achar(this.id); },
      get item() { return this.achado ? this.achado.item : null; },
      init() {
        var a = this.achado;
        if (!a) { location.replace('404.html'); return; }
        if (a.item.tipo !== 'material') { location.replace(this.$store.ps.urlItem(a.turma.id, a.item)); return; }
        this.$store.ps.turmaAtiva = a.turma.id;
        this.$store.ps.titulo = a.turma.nome;
        document.title = a.item.titulo + ' | Sala PS';
      },
      vizinho(passo) {
        var lista = this.$store.ps.itens(this.achado.turma), id = this.id;
        var i = lista.findIndex(function (x) { return x.id === id; });
        return lista[i + passo] || null;
      }
    };
  }
</script>
</body>
</html>
