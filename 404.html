<title>Página não encontrada | Sala PS</title>
<!-- No GitHub Pages, esta página aparece em qualquer endereço inexistente.
     O <base> abaixo faz os arquivos (js, css, imagens) carregarem da raiz do projeto. -->
<script>
  (function () {
    var partes = location.pathname.split('/');
    var base = location.hostname.slice(-10) === 'github.io' && partes.length > 2 ? '/' + partes[1] + '/' : './';
    document.write('<base href="' + base + '">');
  })();
</script>
