<!doctype html>
<html lang="pt-BR" data-pagina="criar-atividade" data-papel="instrutor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar atividade | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-6xl mx-auto">
    <h1 class="text-2xl sm:text-3xl font-extrabold">Criar atividade</h1>

    <!-- Tipo -->
    <fieldset class="mt-6">
      <legend class="text-sm font-semibold">Tipo de atividade</legend>
      <div class="mt-3 grid grid-cols-3 gap-3 max-w-2xl">
        <template x-for="t in [{v:'material',n:'Material',d:'PDF, vídeo ou link'},{v:'tarefa',n:'Tarefa',d:'Com entrega e nota'},{v:'quiz',n:'Quiz',d:'Perguntas com correção automática'}]" :key="t.v">
          <label class="cursor-pointer">
            <input type="radio" name="tipo" class="peer sr-only" :value="t.v" x-model="f.tipo">
            <span class="flex flex-col items-start gap-2 h-full rounded-2xl border-2 p-4 peer-focus-visible:ring-2 peer-focus-visible:ring-ps-azul"
                  :class="f.tipo === t.v ? 'border-ps-azul bg-white dark:bg-ps-noite2' : 'border-ps-linha dark:border-ps-noite3 hover:border-ps-claro'">
              <span class="h-10 w-10 rounded-full inline-flex items-center justify-center" :class="$store.ps.corTipo(t.v)" x-html="ic(t.v)"></span>
              <span class="font-bold" x-text="t.n"></span>
              <span class="hidden sm:block text-xs text-ps-cinza dark:text-slate-400" x-text="t.d"></span>
            </span>
          </label>
        </template>
      </div>
    </fieldset>

    <!-- Quiz vai para o editor -->
    <div x-show="f.tipo === 'quiz'" x-cloak class="mt-6 max-w-2xl rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-6">
      <p class="font-bold">Quizzes têm um editor próprio</p>
      <p class="mt-1 text-sm text-ps-cinza dark:text-slate-400">Lá você monta as perguntas, as alternativas e marca a resposta certa.</p>
      <a :href="'editor-quiz.html?t=' + f.turma" class="mt-4 h-11 px-6 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro inline-flex items-center gap-2 hover:brightness-105">Abrir editor de quiz<span x-html="ic('direita', '!w-4 !h-4')"></span></a>
    </div>

    <div x-show="f.tipo !== 'quiz'" class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_340px] items-start">
      <form class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 sm:p-6 flex flex-col gap-4" @submit.prevent="publicar()" novalidate>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label for="turma" class="text-sm font-semibold">Turma</label>
            <select id="turma" x-model="f.turma" @change="f.topico = topicos()[0] || ''; novoTopico = !topicos().length" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 px-3 focus:outline-none focus:ring-2 focus:ring-ps-azul">
              <template x-for="t in $store.ps.turmas()" :key="t.id"><option :value="t.id" x-text="t.nome" :selected="t.id === f.turma"></option></template>
            </select>
          </div>
          <div>
            <label for="topico" class="text-sm font-semibold">Tópico</label>
            <select id="topico" x-show="!novoTopico" x-model="f.topico" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 px-3 focus:outline-none focus:ring-2 focus:ring-ps-azul">
              <template x-for="tp in topicos()" :key="tp"><option :value="tp" x-text="tp" :selected="tp === f.topico"></option></template>
            </select>
            <input id="novo-topico" x-show="novoTopico" x-cloak x-model="f.novoTopico" type="text" placeholder="Nome do novo tópico" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
            <button type="button" @click="novoTopico = !novoTopico" class="mt-1 text-xs font-semibold text-ps-texto dark:text-ps-claro hover:underline" x-text="novoTopico ? 'Usar tópico existente' : '+ Novo tópico'"></button>
          </div>
        </div>
        <div>
          <label for="titulo" class="text-sm font-semibold">Título</label>
          <input id="titulo" x-model="f.titulo" type="text" class="mt-2 w-full h-12 rounded-xl border bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul" :class="erro && !f.titulo.trim() ? 'border-red-500' : 'border-ps-linha dark:border-ps-noite3'">
        </div>
        <div>
          <label for="desc" class="text-sm font-semibold" x-text="f.tipo === 'tarefa' ? 'Instruções' : 'Descrição'"></label>
          <textarea id="desc" x-model="f.descricao" rows="5" class="mt-2 w-full rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent p-3 text-[15px] focus:outline-none focus:ring-2 focus:ring-ps-azul"></textarea>
        </div>
        <div x-show="f.tipo === 'tarefa'" class="grid grid-cols-2 gap-4">
          <div>
            <label for="pontos" class="text-sm font-semibold">Pontos</label>
            <input id="pontos" x-model.number="f.pontos" type="number" min="1" max="100" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
          </div>
          <div>
            <label for="prazo" class="text-sm font-semibold">Prazo <span class="font-normal text-ps-cinza dark:text-slate-400">(opcional)</span></label>
            <input id="prazo" x-model="f.prazo" type="date" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-3 focus:outline-none focus:ring-2 focus:ring-ps-azul dark:[color-scheme:dark]">
          </div>
        </div>
        <div x-show="f.tipo === 'material'">
          <label for="link" class="text-sm font-semibold">Link do material <span class="font-normal text-ps-cinza dark:text-slate-400">(opcional)</span></label>
          <input id="link" x-model="f.link" type="url" placeholder="https://" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
        </div>
        <p x-show="erro" class="text-sm font-semibold text-red-700 dark:text-red-400" role="alert" x-text="erro"></p>
        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" class="h-12 px-8 rounded-full text-[15px] font-bold bg-ps-azul text-ps-escuro hover:brightness-105">Publicar</button>
          <a :href="'turma.html?t=' + f.turma + '&aba=atividades'" class="h-12 px-6 rounded-full text-sm font-semibold inline-flex items-center hover:bg-ps-fundo dark:hover:bg-ps-noite3">Cancelar</a>
        </div>
      </form>

      <!-- Prévia -->
      <aside class="lg:sticky lg:top-24 flex flex-col gap-4">
        <div class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5">
          <p class="text-xs font-bold tracking-[1.5px] text-ps-cinza dark:text-slate-400">COMO O TRAINEE VÊ</p>
          <p class="mt-3 font-bold border-b-2 pb-2" :style="'border-color:' + (($store.ps.turma(f.turma) || {}).cor || '#26323D')" x-text="(novoTopico ? f.novoTopico : f.topico) || 'Tópico'"></p>
          <div class="mt-2 flex items-center gap-3 py-2">
            <span class="h-10 w-10 rounded-full inline-flex items-center justify-center shrink-0" :class="$store.ps.corTipo(f.tipo)" x-html="ic(f.tipo)"></span>
            <span class="flex-1 min-w-0">
              <span class="block font-semibold truncate" x-text="f.titulo || 'Título da atividade'"></span>
              <span class="block text-xs text-ps-cinza dark:text-slate-400" x-text="$store.ps.rotulo(f.tipo)"></span>
            </span>
            <span x-show="f.tipo === 'tarefa'" class="text-xs text-ps-cinza dark:text-slate-400" x-text="'Prazo: ' + (f.prazo ? dataCurta(f.prazo) : '[a definir]')"></span>
          </div>
        </div>
        <div x-show="criadas().length" class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5">
          <p class="font-bold">Criadas por você nesta turma</p>
          <ul class="mt-3 flex flex-col gap-2">
            <template x-for="e in criadas()" :key="e.item.id">
              <li class="flex items-center gap-2 text-sm">
                <span class="h-7 w-7 rounded-full inline-flex items-center justify-center shrink-0" :class="$store.ps.corTipo(e.item.tipo)" x-html="ic(e.item.tipo, '!w-4 !h-4')"></span>
                <a :href="$store.ps.urlItem(f.turma, e.item)" class="flex-1 truncate hover:underline" x-text="e.item.titulo"></a>
                <button type="button" @click="if (confirm('Excluir esta atividade?')) $store.ps.excluirAtividade(f.turma, e.item.id)" class="h-9 w-9 rounded-full inline-flex items-center justify-center text-ps-cinza hover:bg-ps-fundo dark:hover:bg-ps-noite3" :aria-label="'Excluir ' + e.item.titulo" x-html="ic('lixo', '!w-4 !h-4')"></button>
              </li>
            </template>
          </ul>
        </div>
      </aside>
    </div>
  </div>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      novoTopico: false, erro: '',
      f: { tipo: param('tipo') || 'tarefa', turma: param('t') || TURMAS[0].id, topico: '', novoTopico: '', titulo: '', descricao: '', pontos: 10, prazo: '', link: '' },
      init() {
        this.$store.ps.titulo = 'Criar atividade';
        if (!this.$store.ps.turma(this.f.turma)) this.f.turma = TURMAS[0].id;
        this.f.topico = this.topicos()[0] || '';
        this.novoTopico = !this.topicos().length;
      },
      topicos() { return this.$store.ps.topicosDe(this.f.turma); },
      criadas() { return this.$store.ps.atividadesCriadas[this.f.turma] || []; },
      publicar() {
        var f = this.f, topico = (this.novoTopico ? f.novoTopico : f.topico).trim();
        if (!f.titulo.trim()) { this.erro = 'Dê um título para a atividade.'; document.getElementById('titulo').focus(); return; }
        if (!topico) { this.erro = 'Escolha ou crie um tópico.'; return; }
        this.erro = '';
        var item = { tipo: f.tipo, titulo: f.titulo.trim(), descricao: f.descricao.trim() || '[Sem descrição]' };
        if (f.tipo === 'tarefa') { item.pontos = Math.max(1, +f.pontos || 10); item.prazo = f.prazo || null; }
        if (f.tipo === 'material' && f.link.trim()) item.link = f.link.trim();
        var id = this.$store.ps.criarAtividade(f.turma, topico, item);
        this.$store.ps.salvar();
        location.href = this.$store.ps.urlItem(f.turma, { tipo: f.tipo, id: id });
      }
    };
  }
</script>
</body>
</html>
