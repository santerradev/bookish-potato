<!doctype html>
<html lang="pt-BR" data-pagina="turma-config" data-papel="instrutor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurar turma | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
<template x-if="turma()">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-4xl mx-auto">
    <a :href="'turma.html?t=' + tid" class="inline-flex items-center gap-2 min-h-[44px] text-sm font-semibold text-ps-texto dark:text-ps-claro hover:underline"><span x-html="ic('voltar', '!w-4 !h-4')"></span>Voltar à turma</a>
    <div class="mt-2 flex flex-wrap items-end gap-3">
      <h1 class="text-2xl sm:text-3xl font-extrabold mr-auto">Configurar turma</h1>
      <label class="flex items-center gap-2 text-sm">
        <span class="text-ps-cinza dark:text-slate-400">Turma</span>
        <select x-model="tid" @change="carregar(); history.replaceState(null, '', 'turma-config.html?t=' + tid)" class="h-11 rounded-lg border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 px-3 text-sm">
          <template x-for="t in $store.ps.turmas(true)" :key="t.id"><option :value="t.id" x-text="t.nome + (t.arquivada ? ' (arquivada)' : '')" :selected="t.id === tid"></option></template>
        </select>
      </label>
    </div>

    <!-- Prévia do banner -->
    <div class="mt-6 relative overflow-hidden rounded-2xl h-36 sm:h-44 p-5 sm:p-7 flex flex-col justify-end text-white transition-colors" :style="'background:' + f.cor">
      <svg class="banner-deco" viewBox="0 0 800 176" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"><circle cx="700" cy="30" r="120" fill="none" stroke="#53CCF5" stroke-width="3"/><circle cx="700" cy="30" r="75" fill="none" stroke="#53CCF5" stroke-width="3"/><path d="M480 176 L590 70 L700 176 Z" fill="#00AFE3"/></svg>
      <p class="relative text-xs font-bold tracking-[1.5px] opacity-80">PRÉVIA</p>
      <p class="relative text-2xl sm:text-3xl font-extrabold truncate" x-text="f.nome || 'Nome da turma'"></p>
      <p class="relative text-sm sm:text-base opacity-90 truncate" x-text="f.secao || 'Seção'"></p>
    </div>

    <form class="mt-6 rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 sm:p-6" @submit.prevent="salvar()" aria-labelledby="t-det">
      <h2 id="t-det" class="text-lg font-bold">Detalhes</h2>
      <div class="mt-4 grid sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label for="nome" class="text-sm font-semibold">Nome da turma</label>
          <input id="nome" x-model="f.nome" type="text" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
        </div>
        <div>
          <label for="secao" class="text-sm font-semibold">Seção</label>
          <input id="secao" x-model="f.secao" type="text" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
        </div>
        <div>
          <label for="instrutor" class="text-sm font-semibold">Instrutor(a)</label>
          <input id="instrutor" x-model="f.instrutor" type="text" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
        </div>
      </div>
      <fieldset class="mt-5">
        <legend class="text-sm font-semibold">Cor do banner</legend>
        <div class="mt-3 flex flex-wrap gap-3">
          <template x-for="c in CORES_TURMA" :key="c">
            <label class="cursor-pointer">
              <input type="radio" name="cor" class="peer sr-only" :value="c" x-model="f.cor">
              <span class="block h-11 w-11 rounded-full border-[3px] peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-ps-azul" :class="f.cor === c ? 'border-ps-azul' : 'border-transparent'" :style="'background:' + c" :title="c"></span>
              <span class="sr-only" x-text="'Cor ' + c"></span>
            </label>
          </template>
        </div>
      </fieldset>
      <button type="submit" :disabled="!f.nome.trim()" class="mt-6 h-11 px-6 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro hover:brightness-105 disabled:opacity-40">Salvar alterações</button>
    </form>

    <div class="mt-6 grid gap-6 md:grid-cols-2">
      <section class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 sm:p-6" aria-labelledby="t-cod">
        <h2 id="t-cod" class="text-lg font-bold">Código da turma</h2>
        <p class="mt-1 text-sm text-ps-cinza dark:text-slate-400">Trainees usam este código para entrar.</p>
        <p class="mt-4 text-3xl font-extrabold tracking-widest text-ps-texto dark:text-ps-claro" x-text="turma().codigo"></p>
        <div class="mt-4 flex flex-wrap gap-2">
          <button type="button" @click="copiar()" class="h-10 px-4 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('copiar', '!w-4 !h-4')"></span>Copiar</button>
          <button type="button" @click="novoCodigo()" class="h-10 px-4 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('restaurar', '!w-4 !h-4')"></span>Gerar novo</button>
        </div>
      </section>

      <section class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 sm:p-6" aria-labelledby="t-conv">
        <h2 id="t-conv" class="text-lg font-bold">Convidar pessoas</h2>
        <form class="mt-4 flex gap-2" @submit.prevent="convidar()" novalidate>
          <label for="conv" class="sr-only">E-mail</label>
          <input id="conv" x-model="email" type="email" placeholder="nome@psjunior.com" class="flex-1 min-w-0 h-11 rounded-xl border bg-transparent px-3 text-sm focus:outline-none focus:ring-2 focus:ring-ps-azul" :class="erroEmail ? 'border-red-500' : 'border-ps-linha dark:border-ps-noite3'" :aria-invalid="(!!erroEmail).toString()" aria-describedby="e-conv">
          <button type="submit" class="h-11 px-4 rounded-xl text-sm font-bold bg-ps-azul text-ps-escuro inline-flex items-center gap-1.5"><span x-html="ic('usuarioMais', '!w-4 !h-4')"></span>Convidar</button>
        </form>
        <p id="e-conv" x-show="erroEmail" class="mt-1 text-sm font-semibold text-red-700 dark:text-red-400" x-text="erroEmail"></p>
        <ul class="mt-3 flex flex-col gap-1.5">
          <template x-for="(c, i) in ($store.ps.convites[tid] || [])" :key="i">
            <li class="flex items-center gap-2 text-sm"><span class="text-ps-cinza" x-html="ic('email', '!w-4 !h-4')"></span><span class="flex-1 truncate" x-text="c"></span><span class="text-xs text-ps-cinza dark:text-slate-400">Convite enviado (demo)</span></li>
          </template>
        </ul>
      </section>
    </div>

    <section class="mt-6 rounded-2xl border border-red-200 dark:border-red-400/30 bg-white dark:bg-ps-noite2 p-5 sm:p-6" aria-labelledby="t-arq">
      <h2 id="t-arq" class="text-lg font-bold" x-text="turma().arquivada ? 'Turma arquivada' : 'Arquivar turma'"></h2>
      <p class="mt-1 text-sm text-ps-cinza dark:text-slate-400" x-text="turma().arquivada ? 'Ela não aparece no Início nem no menu. Restaure para voltar a usar.' : 'A turma some do Início e do menu, mas nada é apagado. Dá para restaurar depois.'"></p>
      <button type="button" @click="arquivar()" class="mt-4 h-11 px-5 rounded-full text-sm font-semibold inline-flex items-center gap-2"
              :class="turma().arquivada ? 'border border-ps-linha dark:border-ps-noite3 hover:bg-ps-fundo dark:hover:bg-ps-noite3' : 'text-red-700 dark:text-red-400 border border-red-200 dark:border-red-400/30 hover:bg-red-50 dark:hover:bg-red-400/10'">
        <span x-html="ic('caixa', '!w-4 !h-4')"></span><span x-text="turma().arquivada ? 'Restaurar turma' : 'Arquivar turma'"></span>
      </button>
    </section>
  </div>
</template>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      tid: param('t') || TURMAS[0].id, f: { nome: '', secao: '', cor: '', instrutor: '' }, email: '', erroEmail: '',
      turma() { return this.$store.ps.turma(this.tid); },
      init() {
        if (!this.turma()) { location.replace('404.html'); return; }
        this.$store.ps.titulo = 'Configurar turma';
        this.carregar();
      },
      carregar() {
        var t = this.turma();
        this.$store.ps.turmaAtiva = t.id;
        this.f = { nome: t.nome, secao: t.secao, cor: t.cor, instrutor: t.instrutor };
      },
      salvar() {
        if (!this.f.nome.trim()) return;
        this.$store.ps.ajustarTurma(this.tid, { nome: this.f.nome.trim(), secao: this.f.secao.trim(), cor: this.f.cor, instrutor: this.f.instrutor.trim() || '[Instrutor(a)]' });
        this.$store.ps.avisar('Turma atualizada.');
      },
      novoCodigo() {
        var letras = 'abcdefghjkmnpqrstuvwxyz23456789', c = '';
        for (var i = 0; i < 7; i++) c += letras.charAt(Math.floor(Math.random() * letras.length));
        this.$store.ps.ajustarTurma(this.tid, { codigo: c });
        this.$store.ps.avisar('Novo código gerado. O anterior deixa de valer.');
      },
      copiar() {
        var self = this, c = this.turma().codigo;
        if (navigator.clipboard) navigator.clipboard.writeText(c).then(function () { self.$store.ps.avisar('Código copiado.'); }, function () { self.$store.ps.avisar('Não foi possível copiar.'); });
        else this.$store.ps.avisar('Código: ' + c);
      },
      convidar() {
        var e = this.email.trim();
        if (!/^\S+@\S+\.\S+$/.test(e)) { this.erroEmail = 'Digite um e-mail válido.'; return; }
        this.erroEmail = ''; this.$store.ps.convidar(this.tid, e); this.email = '';
        this.$store.ps.avisar('Convite enviado (demo).');
      },
      arquivar() {
        var arq = this.turma().arquivada;
        if (!arq && !confirm('Arquivar a turma "' + this.turma().nome + '"?')) return;
        this.$store.ps.arquivar(this.tid, !arq);
      }
    };
  }
</script>
</body>
</html>
