<!doctype html>
<html lang="pt-BR" data-pagina="ajuda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajuda | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-4xl mx-auto">
    <div class="relative overflow-hidden rounded-3xl bg-ps-escuro text-white p-6 sm:p-10">
      <svg class="banner-deco" viewBox="0 0 800 260" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
        <circle cx="720" cy="40" r="150" fill="none" stroke="#53CCF5" stroke-width="3"/><circle cx="720" cy="40" r="95" fill="none" stroke="#53CCF5" stroke-width="3"/>
        <path d="M520 260 L640 120 L760 260 Z" fill="#00AFE3"/>
      </svg>
      <h1 class="relative text-3xl sm:text-4xl font-extrabold">Como podemos ajudar?</h1>
      <div class="relative mt-6 flex items-center gap-2 h-12 px-4 rounded-full bg-white text-ps-escuro max-w-xl focus-within:ring-2 focus-within:ring-ps-claro">
        <span class="text-ps-cinza" x-html="ic('busca', '!w-4 !h-4')"></span>
        <label for="q" class="sr-only">Buscar na ajuda</label>
        <input id="q" type="search" x-model="q" placeholder="Ex.: entregar tarefa, nota, certificado" class="flex-1 min-w-0 bg-transparent text-[15px] focus:outline-none">
      </div>
    </div>

    <div class="mt-6 grid sm:grid-cols-3 gap-3">
      <a href="boas-vindas.html" class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 hover:border-ps-azul">
        <span class="text-ps-texto dark:text-ps-claro" x-html="ic('estrela')"></span>
        <p class="mt-2 font-bold">Rever o tour</p><p class="text-sm text-ps-cinza dark:text-slate-400">Os 4 passos de boas-vindas.</p>
      </a>
      <a href="configuracoes.html" class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 hover:border-ps-azul">
        <span class="text-ps-texto dark:text-ps-claro" x-html="ic('engrenagem')"></span>
        <p class="mt-2 font-bold">Configurações</p><p class="text-sm text-ps-cinza dark:text-slate-400">Tema, texto maior e avisos.</p>
      </a>
      <a href="privacidade.html" class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 hover:border-ps-azul">
        <span class="text-ps-texto dark:text-ps-claro" x-html="ic('escudo')"></span>
        <p class="mt-2 font-bold">Privacidade</p><p class="text-sm text-ps-cinza dark:text-slate-400">Seus dados e a LGPD.</p>
      </a>
    </div>

    <template x-for="g in grupos()" :key="g.nome">
      <section class="mt-8">
        <h2 class="text-xl font-extrabold" x-text="g.nome"></h2>
        <div class="mt-3 rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 divide-y divide-ps-linha dark:divide-ps-noite3">
          <template x-for="p in g.itens" :key="p.q">
            <div x-data="{ aberto: false }">
              <button type="button" @click="aberto = !aberto" :aria-expanded="aberto.toString()" class="w-full min-h-[56px] px-5 py-3 flex items-center gap-4 text-left font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ps-azul rounded-2xl">
                <span class="flex-1" x-text="p.q"></span>
                <span class="transition-transform" :class="aberto && 'rotate-180'" x-html="ic('baixo', '!w-4 !h-4')"></span>
              </button>
              <div x-show="aberto" x-collapse><p class="px-5 pb-4 text-[15px] leading-7 text-ps-cinza dark:text-slate-300" x-text="p.r"></p></div>
            </div>
          </template>
        </div>
      </section>
    </template>
    <template x-if="grupos().length === 0">
      <p class="mt-10 text-center text-ps-cinza dark:text-slate-400">Nenhuma resposta para "<span x-text="q"></span>". Fale com o suporte.</p>
    </template>

    <section class="mt-10 rounded-2xl bg-ps-suave dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-6 flex flex-col sm:flex-row sm:items-center gap-4">
      <span class="h-12 w-12 rounded-xl bg-white dark:bg-ps-noite3 text-ps-texto dark:text-ps-claro inline-flex items-center justify-center shrink-0" x-html="ic('email')"></span>
      <div class="flex-1">
        <h2 class="font-bold">Não achou o que procurava?</h2>
        <p class="text-sm text-ps-cinza dark:text-slate-400">Fale com o suporte da Sala PS: [e-mail de suporte]</p>
      </div>
    </section>
  </div>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  var FAQ = [
    { nome: 'Para trainees', itens: [
      { q: 'Como entro numa turma?', r: 'Clique no + no topo e escolha "Participar da turma". Digite o código que o instrutor passou.' },
      { q: 'Como entrego uma tarefa?', r: 'Abra a tarefa, adicione um link ou arquivo em "Seu trabalho" e clique em "Entregar". Se não precisar de anexo, use "Marcar como concluída". Enquanto não houver nota, dá para cancelar a entrega e mandar de novo.' },
      { q: 'Onde vejo minhas notas?', r: 'Em "Notas", no menu lateral. Lá aparecem a nota de cada tarefa e quiz, o feedback do instrutor e o seu aproveitamento por turma.' },
      { q: 'Posso refazer um quiz?', r: 'Sim. Depois de enviar, o resultado mostra a revisão de cada pergunta e um botão "Refazer".' },
      { q: 'Como consigo o certificado?', r: 'Ao concluir todas as atividades de uma turma, o certificado fica disponível em "Certificados" para visualizar e imprimir ou salvar em PDF.' },
      { q: 'Como falo só com o instrutor?', r: 'Dentro de cada tarefa há "Comentários particulares". Só você e o instrutor veem essa conversa.' }
    ]},
    { nome: 'Para instrutores', itens: [
      { q: 'Como publico uma atividade?', r: 'Use "Criar atividade" no menu. Escolha material, tarefa ou quiz, a turma e o tópico. Para quizzes, o editor permite montar as perguntas e marcar a alternativa certa.' },
      { q: 'Como corrijo as entregas?', r: 'Em "Corrigir", escolha a turma e a tarefa, selecione o trainee, dê a nota e o feedback e clique em "Devolver". A nota aparece na hora para o trainee.' },
      { q: 'Onde vejo o desempenho da turma?', r: 'Em "Desempenho" (gráficos de entregas) e no "Livro de notas" (todas as notas numa tabela, com exportação em CSV).' },
      { q: 'Como mudo o nome ou a cor da turma?', r: 'Na turma, clique em "Configurar turma". Lá também dá para gerar um novo código e convidar pessoas.' }
    ]},
    { nome: 'Conta e privacidade', itens: [
      { q: 'Esqueci minha senha.', r: 'Na tela de login, clique em "Esqueci minha senha" e informe seu e-mail para receber o link.' },
      { q: 'Como deixo o texto maior ou ativo o modo escuro?', r: 'Em Configurações > Aparência. O tema também pode seguir o do seu aparelho.' },
      { q: 'Onde ficam meus dados nesta demo?', r: 'Só no navegador deste aparelho. Em Configurações você pode baixar uma cópia ou apagar tudo.' }
    ]}
  ];
  function pagina() {
    return {
      q: '',
      init() { this.$store.ps.titulo = 'Ajuda'; },
      grupos() {
        var q = this.q.trim().toLowerCase();
        return FAQ.map(function (g) {
          return { nome: g.nome, itens: g.itens.filter(function (p) { return !q || (p.q + ' ' + p.r).toLowerCase().indexOf(q) >= 0; }) };
        }).filter(function (g) { return g.itens.length; });
      }
    };
  }
</script>
</body>
</html>
