<!doctype html>
<html lang="pt-BR" data-pagina="perfil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <section class="px-4 sm:px-6 py-6 sm:py-8 max-w-5xl mx-auto" aria-labelledby="t-perfil">

    <!-- Cabeçalho do perfil -->
    <div class="relative overflow-hidden rounded-2xl bg-ps-escuro text-white p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center gap-5">
      <svg class="banner-deco" viewBox="0 0 800 200" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
        <circle cx="720" cy="30" r="130" fill="none" stroke="#53CCF5" stroke-width="3"/>
        <circle cx="720" cy="30" r="80" fill="none" stroke="#53CCF5" stroke-width="3"/>
        <path d="M520 200 L630 80 L740 200 Z" fill="#00AFE3"/>
      </svg>
      <span class="relative h-20 w-20 sm:h-24 sm:w-24 rounded-full bg-ps-azul text-ps-escuro text-3xl font-extrabold inline-flex items-center justify-center shrink-0 ring-4 ring-white/20" x-text="$store.ps.iniciais()"></span>
      <div class="relative min-w-0">
        <h1 id="t-perfil" class="text-2xl sm:text-3xl font-extrabold truncate" x-text="$store.ps.usuario && $store.ps.usuario.nome"></h1>
        <p class="mt-1 text-slate-300">
          <span x-text="$store.ps.instrutor() ? 'Instrutor(a)' : 'Trainee'"></span> · PSEL26/2
          <template x-if="$store.ps.perfil.area"><span> · <span x-text="$store.ps.perfil.area"></span></span></template>
        </p>
      </div>
    </div>

    <div class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] items-start">

      <!-- Dados -->
      <form class="rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-5 sm:p-6" @submit.prevent="salvar()" aria-labelledby="t-dados">
        <h2 id="t-dados" class="text-lg font-bold">Dados pessoais</h2>
        <label for="nome" class="block mt-5 text-sm font-semibold">Nome</label>
        <input id="nome" type="text" x-model="nome" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-4 focus:outline-none focus:ring-2 focus:ring-ps-azul">
        <label for="email" class="block mt-4 text-sm font-semibold">E-mail</label>
        <input id="email" type="email" value="[e-mail da PS]" disabled class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-ps-fundo dark:bg-ps-noite px-4 text-ps-cinza dark:text-slate-400 cursor-not-allowed">
        <label for="area" class="block mt-4 text-sm font-semibold">Área de interesse na PS</label>
        <select id="area" x-model="area" class="mt-2 w-full h-12 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 px-3 focus:outline-none focus:ring-2 focus:ring-ps-azul">
          <option value="">Ainda não escolhi</option>
          <template x-for="a in AREAS_PS" :key="a"><option :value="a" x-text="a" :selected="a === area"></option></template>
        </select>
        <button type="submit" :disabled="!nome.trim()" class="mt-6 h-11 px-6 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro hover:brightness-105 disabled:opacity-40">Salvar alterações</button>
      </form>

      <!-- Desempenho -->
      <div class="flex flex-col gap-6">
        <section class="rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-5 sm:p-6" aria-labelledby="t-desemp">
          <h2 id="t-desemp" class="text-lg font-bold">Seu trainee em números</h2>
          <dl class="mt-4 grid grid-cols-2 gap-3">
            <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-4"><dt class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Materiais vistos</dt><dd class="mt-1 text-2xl font-extrabold" x-text="numeros().materiais"></dd></div>
            <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-4"><dt class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Tarefas entregues</dt><dd class="mt-1 text-2xl font-extrabold" x-text="numeros().tarefas"></dd></div>
            <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-4"><dt class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Quizzes feitos</dt><dd class="mt-1 text-2xl font-extrabold" x-text="numeros().quizzes"></dd></div>
            <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-4"><dt class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Comentários</dt><dd class="mt-1 text-2xl font-extrabold" x-text="numeros().comentarios"></dd></div>
          </dl>
          <h3 class="mt-6 text-sm font-bold">Progresso por turma</h3>
          <ul class="mt-3 flex flex-col gap-3">
            <template x-for="t in $store.ps.turmas()" :key="t.id">
              <li>
                <div class="flex justify-between gap-3 text-sm">
                  <a :href="'turma.html?t=' + t.id" class="truncate hover:underline" x-text="t.nome"></a>
                  <span class="font-semibold tabular-nums" x-text="$store.ps.progresso(t) + '%'"></span>
                </div>
                <div class="mt-1.5 h-2 rounded-full bg-ps-fundo dark:bg-ps-noite3 overflow-hidden" role="progressbar" :aria-valuenow="$store.ps.progresso(t)" aria-valuemin="0" aria-valuemax="100" :aria-label="'Progresso em ' + t.nome">
                  <div class="h-full rounded-full" :style="'width:' + $store.ps.progresso(t) + '%; background:' + ($store.ps.escuro ? '#53CCF5' : t.cor)"></div>
                </div>
              </li>
            </template>
          </ul>
        </section>

        <section class="rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-5 sm:p-6" aria-labelledby="t-pref">
          <h2 id="t-pref" class="text-lg font-bold">Preferências</h2>
          <div class="mt-4 flex items-center justify-between gap-4">
            <span id="r-tema" class="text-sm font-semibold">Modo escuro</span>
            <button type="button" role="switch" :aria-checked="$store.ps.escuro.toString()" aria-labelledby="r-tema" @click="$store.ps.alternarTema()"
                    class="relative h-7 w-12 rounded-full transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-ps-azul"
                    :class="$store.ps.escuro ? 'bg-ps-azul' : 'bg-slate-300'">
              <span class="absolute top-1 left-1 h-5 w-5 rounded-full bg-white shadow transition-transform" :class="$store.ps.escuro && 'translate-x-5'"></span>
            </button>
          </div>
          <div class="mt-4 flex items-center justify-between gap-4">
            <span class="text-sm font-semibold">Visão</span>
            <button type="button" @click="$store.ps.trocarPapel()" class="h-10 px-4 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3">
              <span x-html="ic('trocar', '!w-4 !h-4')"></span><span x-text="$store.ps.instrutor() ? 'Ver como trainee' : 'Ver como instrutor'"></span>
            </button>
          </div>
          <div class="mt-4 flex items-center justify-between gap-4">
            <span class="text-sm font-semibold">Tour de boas-vindas</span>
            <a href="boas-vindas.html" class="h-10 px-4 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('estrela', '!w-4 !h-4')"></span>Rever tour</a>
          </div>
          <div class="mt-6 pt-5 border-t border-ps-linha dark:border-ps-noite3 flex flex-wrap gap-3">
            <button type="button" @click="$store.ps.restaurar()" class="h-11 px-5 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('restaurar', '!w-4 !h-4')"></span>Restaurar demo</button>
            <button type="button" @click="$store.ps.sair()" class="h-11 px-5 rounded-full text-sm font-semibold text-red-700 dark:text-red-400 border border-red-200 dark:border-red-400/30 inline-flex items-center gap-2 hover:bg-red-50 dark:hover:bg-red-400/10"><span x-html="ic('sair', '!w-4 !h-4')"></span>Sair</button>
          </div>
        </section>
      </div>
    </div>
  </section>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      nome: '', area: '',
      init() {
        this.$store.ps.titulo = 'Meu perfil';
        this.nome = (this.$store.ps.usuario && this.$store.ps.usuario.nome) || '';
        this.area = this.$store.ps.perfil.area || '';
      },
      salvar() {
        if (!this.nome.trim()) return;
        this.$store.ps.usuario.nome = this.nome.trim();
        this.$store.ps.perfil.area = this.area;
        this.$store.ps.avisar('Perfil atualizado.');
      },
      numeros() {
        var s = this.$store.ps;
        var meus = 0;
        Object.keys(s.comentarios).forEach(function (k) {
          s.comentarios[k].forEach(function (c) { if (c.autor === s.usuario.nome) meus++; });
        });
        return {
          materiais: Object.keys(s.feitos).length,
          tarefas: Object.keys(s.entregas).length,
          quizzes: Object.keys(s.quizzes).length,
          comentarios: meus
        };
      }
    };
  }
</script>
</body>
</html>
