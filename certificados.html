<!doctype html>
<html lang="pt-BR" data-pagina="certificados">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificados | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="($store.ps.menu || aberto) && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <section class="px-4 sm:px-6 py-6 sm:py-8 max-w-6xl mx-auto" aria-labelledby="t-cert">
    <h1 id="t-cert" class="text-2xl sm:text-3xl font-extrabold">Certificados</h1>
    <p class="mt-1 text-[15px] text-ps-cinza dark:text-slate-400">Conclua todas as atividades de uma turma para liberar o certificado.</p>

    <dl class="mt-6 grid grid-cols-2 sm:grid-cols-3 gap-3 max-w-2xl">
      <div class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-4">
        <dt class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Disponíveis</dt>
        <dd class="mt-1 text-3xl font-extrabold" x-text="disponiveis().length"></dd>
      </div>
      <div class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-4">
        <dt class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Em andamento</dt>
        <dd class="mt-1 text-3xl font-extrabold" x-text="$store.ps.turmas().length - disponiveis().length"></dd>
      </div>
    </dl>

    <div class="mt-8 grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      <template x-for="t in $store.ps.turmas()" :key="t.id">
        <article class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 overflow-hidden flex flex-col">
          <div class="relative h-24 px-5 py-4 text-white" :style="'background:' + t.cor">
            <svg class="banner-deco" viewBox="0 0 400 96" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"><circle cx="360" cy="10" r="60" fill="none" stroke="#53CCF5" stroke-width="2"/><path d="M250 96 L320 30 L390 96 Z" fill="#00AFE3"/></svg>
            <p class="relative text-lg font-extrabold truncate" x-text="t.nome"></p>
            <p class="relative text-sm opacity-90" x-text="t.secao"></p>
          </div>
          <div class="p-5 flex-1 flex flex-col gap-4">
            <template x-if="completo(t)">
              <p class="inline-flex items-center gap-2 text-sm font-bold text-emerald-700 dark:text-emerald-400"><span x-html="ic('certificado', '!w-5 !h-5')"></span>Certificado disponível</p>
            </template>
            <template x-if="!completo(t)">
              <div>
                <div class="flex justify-between text-sm"><span class="font-semibold">Progresso</span><span class="tabular-nums" x-text="$store.ps.progresso(t) + '%'"></span></div>
                <div class="mt-2 h-2 rounded-full bg-ps-fundo dark:bg-ps-noite3 overflow-hidden" role="progressbar" :aria-valuenow="$store.ps.progresso(t)" aria-valuemin="0" aria-valuemax="100" :aria-label="'Progresso em ' + t.nome">
                  <div class="h-full rounded-full bg-ps-azul" :style="'width:' + $store.ps.progresso(t) + '%'"></div>
                </div>
                <p class="mt-2 text-xs text-ps-cinza dark:text-slate-400" x-text="faltam(t) ? 'Faltam ' + faltam(t) + ' atividades.' : 'Esta turma ainda não tem atividades.'"></p>
              </div>
            </template>
            <div class="mt-auto flex flex-wrap gap-2">
              <button type="button" @click="abrir(t)" class="h-11 px-5 rounded-full text-sm font-bold inline-flex items-center gap-2"
                      :class="completo(t) ? 'bg-ps-azul text-ps-escuro hover:brightness-105' : 'border border-ps-linha dark:border-ps-noite3 hover:bg-ps-fundo dark:hover:bg-ps-noite3'">
                <span x-html="ic(completo(t) ? 'certificado' : 'olho', '!w-4 !h-4')"></span><span x-text="completo(t) ? 'Ver certificado' : 'Ver modelo'"></span>
              </button>
              <a x-show="!completo(t)" :href="'turma.html?t=' + t.id + '&aba=atividades'" class="h-11 px-4 rounded-full text-sm font-semibold inline-flex items-center text-ps-texto dark:text-ps-claro hover:underline">Continuar</a>
            </div>
          </div>
        </article>
      </template>
    </div>
  </section>
</main>

<!-- Visualizador do certificado -->
<div x-show="aberto" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6" @keydown.escape.window="aberto = null" role="dialog" aria-modal="true" aria-labelledby="t-modal">
  <div class="absolute inset-0 bg-black/60" @click="aberto = null"></div>
  <div class="relative w-full max-w-4xl max-h-full overflow-y-auto">
    <div class="flex items-center gap-2 mb-3">
      <h2 id="t-modal" class="flex-1 text-white font-bold" x-text="aberto && (completo(aberto) ? 'Certificado' : 'Modelo do certificado')"></h2>
      <button type="button" x-show="aberto && completo(aberto)" @click="window.print()" class="h-11 px-5 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro inline-flex items-center gap-2"><span x-html="ic('impressora', '!w-4 !h-4')"></span>Imprimir ou salvar PDF</button>
      <button type="button" @click="aberto = null" class="h-11 w-11 rounded-full bg-white/10 text-white inline-flex items-center justify-center hover:bg-white/20" aria-label="Fechar" x-html="ic('x')"></button>
    </div>

    <template x-if="aberto">
      <div id="certificado" class="relative overflow-hidden bg-white text-ps-escuro rounded-2xl aspect-[1.414/1] p-[5%] flex flex-col shadow-2xl">
        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1414 1000" preserveAspectRatio="none" aria-hidden="true">
          <rect x="24" y="24" width="1366" height="952" fill="none" stroke="#00AFE3" stroke-width="3" rx="12"/>
          <circle cx="1330" cy="80" r="220" fill="none" stroke="#53CCF5" stroke-width="3" opacity=".35"/>
          <circle cx="1330" cy="80" r="140" fill="none" stroke="#53CCF5" stroke-width="3" opacity=".35"/>
          <path d="M1060 1000 L1200 820 L1340 1000 Z" fill="#00AFE3" opacity=".25"/>
        </svg>
        <span x-show="!completo(aberto)" class="absolute inset-0 flex items-center justify-center pointer-events-none" aria-hidden="true">
          <span class="text-[12vw] sm:text-[120px] font-extrabold text-ps-azul/10 -rotate-12 tracking-widest">MODELO</span>
        </span>
        <div class="relative flex items-center gap-3">
          <img src="img/logo-ps.png" alt="" width="133" height="180" class="h-[clamp(28px,6vw,56px)] w-auto">
          <div class="leading-tight">
            <p class="font-extrabold text-[clamp(11px,2vw,18px)]">PS JÚNIOR CONSULTORIA</p>
            <p class="text-[clamp(9px,1.4vw,13px)] text-ps-cinza">Empresa júnior da UFRGS</p>
          </div>
        </div>
        <div class="relative flex-1 flex flex-col items-center justify-center text-center">
          <p class="font-bold tracking-[0.3em] text-ps-texto text-[clamp(10px,1.8vw,16px)]">CERTIFICADO DE CONCLUSÃO</p>
          <p class="mt-[2%] text-[clamp(9px,1.6vw,15px)] text-ps-cinza">Certificamos que</p>
          <p class="mt-[1%] font-extrabold text-[clamp(18px,4.2vw,44px)] leading-tight" x-text="$store.ps.usuario && $store.ps.usuario.nome"></p>
          <p class="mt-[2%] max-w-[80%] text-[clamp(9px,1.6vw,16px)] leading-relaxed">
            concluiu a turma <b x-text="aberto.nome"></b> do Trainee PSEL26/2 da PS Júnior Consultoria, com carga horária de [carga horária].
          </p>
          <p class="mt-[2%] text-[clamp(9px,1.4vw,14px)] text-ps-cinza" x-text="'Porto Alegre, ' + (completo(aberto) ? hoje() : '[data]')"></p>
        </div>
        <div class="relative grid grid-cols-2 gap-[8%] px-[6%] text-center text-[clamp(8px,1.3vw,13px)]">
          <div><div class="h-px bg-ps-escuro/40 mb-2"></div><p class="font-bold">[Diretor(a) Presidente]</p><p class="text-ps-cinza">PS Júnior Consultoria</p></div>
          <div><div class="h-px bg-ps-escuro/40 mb-2"></div><p class="font-bold" x-text="aberto.instrutor"></p><p class="text-ps-cinza">Instrutor(a) da turma</p></div>
        </div>
        <p class="relative mt-[3%] text-center text-[clamp(7px,1.1vw,11px)] text-ps-cinza">Código de verificação: [código]</p>
      </div>
    </template>
    <p x-show="aberto && !completo(aberto)" class="mt-3 text-sm text-white/80 text-center">Este é só um modelo. Conclua a turma para liberar o seu.</p>
  </div>
</div>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      aberto: null,
      init() { this.$store.ps.titulo = 'Certificados'; },
      completo(t) { return this.$store.ps.itens(t).length > 0 && this.$store.ps.progresso(t) === 100; },
      disponiveis() { var self = this; return this.$store.ps.turmas().filter(function (t) { return self.completo(t); }); },
      faltam(t) { var s = this.$store.ps; return s.itens(t).filter(function (i) { return !s.concluido(i); }).length; },
      abrir(t) { this.aberto = t; },
      hoje() { return new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }); }
    };
  }
</script>
</body>
</html>
