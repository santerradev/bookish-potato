<!doctype html>
<html lang="pt-BR" data-pagina="admin" data-papel="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel admin | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-6xl mx-auto">
    <p class="text-xs font-bold tracking-[1.5px] text-ps-texto dark:text-ps-claro">ADMINISTRAÇÃO</p>
    <h1 class="mt-1 text-2xl sm:text-3xl font-extrabold">Painel</h1>

    <dl class="mt-6 grid grid-cols-2 lg:grid-cols-4 gap-3">
      <template x-for="k in indicadores()" :key="k.n">
        <a :href="k.link" class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5 hover:border-ps-azul focus:outline-none focus-visible:ring-2 focus-visible:ring-ps-azul">
          <dt class="flex items-center gap-2 text-xs font-semibold text-ps-cinza dark:text-slate-400"><span x-html="ic(k.i, '!w-4 !h-4')"></span><span x-text="k.n"></span></dt>
          <dd class="mt-2 text-3xl sm:text-4xl font-extrabold tabular-nums" x-text="k.v"></dd>
          <p class="mt-1 text-xs text-ps-cinza dark:text-slate-400" x-text="k.d"></p>
        </a>
      </template>
    </dl>

    <div class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_320px] items-start">
      <section class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 overflow-hidden" aria-labelledby="t-turmas">
        <div class="flex items-center gap-3 px-5 py-4 border-b border-ps-linha dark:border-ps-noite3">
          <h2 id="t-turmas" class="font-bold flex-1">Turmas</h2>
          <a href="admin-turmas.html" class="text-sm font-semibold text-ps-texto dark:text-ps-claro hover:underline">Gerenciar</a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-left text-xs text-ps-cinza dark:text-slate-400">
              <tr><th class="px-5 py-3 font-semibold">Turma</th><th class="px-3 py-3 font-semibold hidden sm:table-cell">Instrutor(a)</th><th class="px-3 py-3 font-semibold text-right">Atividades</th><th class="px-5 py-3 font-semibold text-right">Para corrigir</th></tr>
            </thead>
            <tbody class="divide-y divide-ps-linha dark:divide-ps-noite3">
              <template x-for="t in $store.ps.turmas(true)" :key="t.id">
                <tr :class="t.arquivada && 'opacity-60'">
                  <td class="px-5 py-3">
                    <a :href="'turma.html?t=' + t.id" class="flex items-center gap-3 font-semibold hover:underline">
                      <span class="h-3 w-3 rounded-full shrink-0 ring-1 ring-black/10 dark:ring-white/40" :style="'background:' + t.cor"></span>
                      <span class="truncate" x-text="t.nome"></span>
                      <span x-show="t.arquivada" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-ps-fundo dark:bg-ps-noite3 text-ps-cinza">Arquivada</span>
                    </a>
                  </td>
                  <td class="px-3 py-3 hidden sm:table-cell text-ps-cinza dark:text-slate-400" x-text="t.instrutor"></td>
                  <td class="px-3 py-3 text-right tabular-nums" x-text="$store.ps.itens(t).length"></td>
                  <td class="px-5 py-3 text-right tabular-nums font-bold" x-text="$store.ps.paraCorrigir(t)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <div class="flex flex-col gap-4">
        <section class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5" aria-labelledby="t-perfis">
          <h2 id="t-perfis" class="font-bold">Usuários por perfil</h2>
          <ul class="mt-3 flex flex-col gap-2 text-sm">
            <template x-for="p in porPerfil()" :key="p.n">
              <li class="flex items-center justify-between"><span x-text="p.n"></span><span class="font-bold tabular-nums" x-text="p.v"></span></li>
            </template>
          </ul>
          <a href="admin-usuarios.html" class="mt-3 inline-block text-sm font-semibold text-ps-texto dark:text-ps-claro hover:underline">Ver usuários</a>
        </section>
        <section class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5" aria-labelledby="t-atalhos">
          <h2 id="t-atalhos" class="font-bold">Atalhos</h2>
          <div class="mt-3 grid gap-2">
            <a href="admin-usuarios.html#novo" class="flex items-center gap-3 rounded-xl px-3 py-2.5 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span class="text-ps-texto dark:text-ps-claro" x-html="ic('usuarioMais')"></span><span class="text-sm font-semibold">Cadastrar usuário</span></a>
            <a href="index.html#criar" class="flex items-center gap-3 rounded-xl px-3 py-2.5 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span class="text-ps-texto dark:text-ps-claro" x-html="ic('grade')"></span><span class="text-sm font-semibold">Criar turma</span></a>
            <a href="admin-trilhas.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span class="text-ps-texto dark:text-ps-claro" x-html="ic('camadas')"></span><span class="text-sm font-semibold">Organizar trilhas</span></a>
            <a href="desempenho.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span class="text-ps-texto dark:text-ps-claro" x-html="ic('grafico')"></span><span class="text-sm font-semibold">Ver desempenho</span></a>
          </div>
        </section>
      </div>
    </div>
    <p class="mt-4 text-xs text-ps-cinza dark:text-slate-400">Números calculados a partir dos dados da demo neste navegador.</p>
  </div>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      init() { this.$store.ps.titulo = 'Administração'; },
      indicadores() {
        var s = this.$store.ps, us = s.usuarios(), todas = s.turmas(true);
        var ativos = us.filter(function (u) { return u.ativo; }).length;
        var arq = todas.filter(function (t) { return t.arquivada; }).length;
        var ativ = todas.reduce(function (n, t) { return n + s.itens(t).length; }, 0);
        return [
          { n: 'Usuários ativos', v: ativos, d: us.length + ' cadastrados', i: 'pessoas', link: 'admin-usuarios.html' },
          { n: 'Turmas ativas', v: todas.length - arq, d: arq + ' arquivadas', i: 'grade', link: 'admin-turmas.html' },
          { n: 'Atividades', v: ativ, d: 'em todas as turmas', i: 'tarefa', link: 'admin-turmas.html' },
          { n: 'Trilhas', v: s.trilhas.length, d: 'sequências de turmas', i: 'camadas', link: 'admin-trilhas.html' }
        ];
      },
      porPerfil() {
        var us = this.$store.ps.usuarios();
        var c = function (p) { return us.filter(function (u) { return u.papel === p; }).length; };
        return [{ n: 'Trainees', v: c('trainee') }, { n: 'Instrutores', v: c('instrutor') }, { n: 'Administradores', v: c('admin') }];
      }
    };
  }
</script>
</body>
</html>
