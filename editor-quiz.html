<!doctype html>
<html lang="pt-BR" data-pagina="editor-quiz" data-papel="instrutor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de quiz | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
  <div class="px-4 sm:px-6 py-6 sm:py-8 max-w-4xl mx-auto">
    <a href="criar-atividade.html" class="inline-flex items-center gap-2 min-h-[44px] text-sm font-semibold text-ps-texto dark:text-ps-claro hover:underline"><span x-html="ic('voltar', '!w-4 !h-4')"></span>Criar atividade</a>
    <div class="mt-2 flex flex-wrap items-center gap-3">
      <h1 class="text-2xl sm:text-3xl font-extrabold mr-auto">Editor de quiz</h1>
      <div class="flex p-1 rounded-full bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3" role="group" aria-label="Modo">
        <button type="button" @click="previa = false" :aria-pressed="(!previa).toString()" class="h-9 px-4 rounded-full text-sm font-semibold" :class="!previa ? 'bg-ps-escuro text-white dark:bg-ps-claro dark:text-ps-escuro' : 'text-ps-cinza dark:text-slate-400'">Editar</button>
        <button type="button" @click="previa = true" :aria-pressed="previa.toString()" class="h-9 px-4 rounded-full text-sm font-semibold" :class="previa ? 'bg-ps-escuro text-white dark:bg-ps-claro dark:text-ps-escuro' : 'text-ps-cinza dark:text-slate-400'">Pré-visualizar</button>
      </div>
    </div>

    <!-- ================= EDITAR ================= -->
    <form x-show="!previa" class="mt-6 flex flex-col gap-5" @submit.prevent="publicar()" novalidate>
      <section class="rounded-2xl bg-white dark:bg-ps-noite2 border-t-8 border-x border-b border-ps-linha dark:border-ps-noite3 p-5 sm:p-6" :style="'border-top-color:' + (($store.ps.turma(f.turma) || {}).cor || '#00AFE3')">
        <label for="titulo" class="sr-only">Título do quiz</label>
        <input id="titulo" x-model="f.titulo" type="text" placeholder="Título do quiz" class="w-full text-2xl font-extrabold bg-transparent border-b-2 py-2 focus:outline-none focus:border-ps-azul" :class="erros.titulo ? 'border-red-500' : 'border-ps-linha dark:border-ps-noite3'">
        <label for="desc" class="sr-only">Descrição</label>
        <input id="desc" x-model="f.descricao" type="text" placeholder="Descrição (opcional)" class="mt-3 w-full bg-transparent border-b border-ps-linha dark:border-ps-noite3 py-2 text-[15px] focus:outline-none focus:border-ps-azul">
        <div class="mt-5 grid sm:grid-cols-3 gap-4">
          <div>
            <label for="turma" class="text-sm font-semibold">Turma</label>
            <select id="turma" x-model="f.turma" @change="f.topico = $store.ps.topicosDe(f.turma)[0] || ''" class="mt-2 w-full h-11 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 px-3">
              <template x-for="t in $store.ps.turmas()" :key="t.id"><option :value="t.id" x-text="t.nome" :selected="t.id === f.turma"></option></template>
            </select>
          </div>
          <div>
            <label for="topico" class="text-sm font-semibold">Tópico</label>
            <input id="topico" x-model="f.topico" list="lista-topicos" type="text" class="mt-2 w-full h-11 rounded-xl border bg-transparent px-3" :class="erros.topico ? 'border-red-500' : 'border-ps-linha dark:border-ps-noite3'">
            <datalist id="lista-topicos"><template x-for="tp in $store.ps.topicosDe(f.turma)" :key="tp"><option :value="tp"></option></template></datalist>
          </div>
          <div>
            <label for="pontos" class="text-sm font-semibold">Pontos</label>
            <input id="pontos" x-model.number="f.pontos" type="number" min="1" max="100" class="mt-2 w-full h-11 rounded-xl border border-ps-linha dark:border-ps-noite3 bg-transparent px-3">
          </div>
        </div>
      </section>

      <template x-for="(q, qi) in perguntas" :key="q.k">
        <section class="rounded-2xl bg-white dark:bg-ps-noite2 border p-5 sm:p-6" :class="erros['q' + qi] ? 'border-red-400' : 'border-ps-linha dark:border-ps-noite3'" :aria-label="'Pergunta ' + (qi + 1)">
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-ps-texto dark:text-ps-claro" x-text="'Pergunta ' + (qi + 1)"></span>
            <span class="ml-auto flex items-center">
              <button type="button" @click="mover(qi, -1)" :disabled="qi === 0" class="h-9 w-9 rounded-full inline-flex items-center justify-center hover:bg-ps-fundo dark:hover:bg-ps-noite3 disabled:opacity-30" :aria-label="'Subir pergunta ' + (qi + 1)" x-html="ic('cima', '!w-4 !h-4')"></button>
              <button type="button" @click="mover(qi, 1)" :disabled="qi === perguntas.length - 1" class="h-9 w-9 rounded-full inline-flex items-center justify-center hover:bg-ps-fundo dark:hover:bg-ps-noite3 disabled:opacity-30" :aria-label="'Descer pergunta ' + (qi + 1)" x-html="ic('baixo', '!w-4 !h-4')"></button>
              <button type="button" @click="duplicar(qi)" class="h-9 w-9 rounded-full inline-flex items-center justify-center hover:bg-ps-fundo dark:hover:bg-ps-noite3" :aria-label="'Duplicar pergunta ' + (qi + 1)" x-html="ic('copiar', '!w-4 !h-4')"></button>
              <button type="button" @click="perguntas.splice(qi, 1)" :disabled="perguntas.length === 1" class="h-9 w-9 rounded-full inline-flex items-center justify-center text-red-700 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-400/10 disabled:opacity-30" :aria-label="'Excluir pergunta ' + (qi + 1)" x-html="ic('lixo', '!w-4 !h-4')"></button>
            </span>
          </div>
          <label :for="'p' + q.k" class="sr-only">Enunciado</label>
          <textarea :id="'p' + q.k" x-model="q.p" rows="2" placeholder="Escreva a pergunta" class="mt-3 w-full rounded-xl border border-ps-linha dark:border-ps-noite3 bg-ps-suave/50 dark:bg-ps-noite p-3 text-[15px] font-semibold focus:outline-none focus:ring-2 focus:ring-ps-azul"></textarea>

          <fieldset class="mt-3">
            <legend class="text-xs font-semibold text-ps-cinza dark:text-slate-400">Alternativas: marque a correta</legend>
            <div class="mt-2 flex flex-col gap-2">
              <template x-for="(op, oi) in q.o" :key="oi">
                <div class="flex items-center gap-3">
                  <input type="radio" :name="'c' + q.k" :checked="q.c === oi" @change="q.c = oi" class="h-5 w-5 shrink-0 accent-[#059669]" :aria-label="'Marcar alternativa ' + 'ABCDE'.charAt(oi) + ' como correta'">
                  <label :for="'o' + q.k + '-' + oi" class="sr-only" x-text="'Alternativa ' + 'ABCDE'.charAt(oi)"></label>
                  <input :id="'o' + q.k + '-' + oi" type="text" x-model="q.o[oi]" :placeholder="'Alternativa ' + 'ABCDE'.charAt(oi)"
                         class="flex-1 min-w-0 h-11 rounded-xl border px-3 text-sm bg-transparent focus:outline-none focus:ring-2 focus:ring-ps-azul"
                         :class="q.c === oi ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-400/10' : 'border-ps-linha dark:border-ps-noite3'">
                  <button type="button" @click="removerOpcao(q, oi)" :disabled="q.o.length <= 2" class="h-9 w-9 rounded-full inline-flex items-center justify-center text-ps-cinza hover:bg-ps-fundo dark:hover:bg-ps-noite3 disabled:opacity-30" :aria-label="'Remover alternativa ' + 'ABCDE'.charAt(oi)" x-html="ic('x', '!w-4 !h-4')"></button>
                </div>
              </template>
            </div>
          </fieldset>
          <button type="button" x-show="q.o.length < 5" @click="q.o.push('')" class="mt-3 text-sm font-semibold text-ps-texto dark:text-ps-claro hover:underline">+ Adicionar alternativa</button>
          <p x-show="erros['q' + qi]" class="mt-2 text-sm font-semibold text-red-700 dark:text-red-400" x-text="erros['q' + qi]"></p>
        </section>
      </template>

      <button type="button" @click="adicionar()" class="h-14 rounded-2xl border-2 border-dashed border-ps-linha dark:border-ps-noite3 text-sm font-bold text-ps-texto dark:text-ps-claro inline-flex items-center justify-center gap-2 hover:border-ps-azul hover:bg-white dark:hover:bg-ps-noite2">
        <span x-html="ic('mais', '!w-5 !h-5')"></span>Adicionar pergunta
      </button>

      <div x-show="Object.keys(erros).length" class="rounded-xl bg-red-50 dark:bg-red-400/10 border border-red-200 dark:border-red-400/30 p-4 text-sm text-red-800 dark:text-red-300" role="alert">
        Revise os campos marcados antes de publicar.
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <button type="submit" class="h-12 px-8 rounded-full text-[15px] font-bold bg-ps-azul text-ps-escuro hover:brightness-105">Publicar quiz</button>
        <span class="text-sm text-ps-cinza dark:text-slate-400" x-text="perguntas.length + (perguntas.length === 1 ? ' pergunta' : ' perguntas') + ' · ' + (f.pontos || 10) + ' pontos'"></span>
      </div>
    </form>

    <!-- ================= PRÉVIA ================= -->
    <section x-show="previa" x-cloak class="mt-6 flex flex-col gap-4" aria-label="Pré-visualização">
      <div class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-6 text-center">
        <span class="mx-auto h-14 w-14 rounded-2xl inline-flex items-center justify-center" :class="$store.ps.corTipo('quiz')" x-html="ic('quiz', '!w-7 !h-7')"></span>
        <p class="mt-3 text-2xl font-extrabold" x-text="f.titulo || 'Título do quiz'"></p>
        <p class="mt-1 text-ps-cinza dark:text-slate-400" x-text="f.descricao"></p>
      </div>
      <template x-for="(q, qi) in perguntas" :key="q.k">
        <div class="rounded-2xl bg-white dark:bg-ps-noite2 border border-ps-linha dark:border-ps-noite3 p-5">
          <p class="font-bold" x-text="(qi + 1) + '. ' + (q.p || '[pergunta]')"></p>
          <ul class="mt-3 flex flex-col gap-2">
            <template x-for="(op, oi) in q.o" :key="oi">
              <li class="flex items-center gap-3 rounded-xl border-2 px-4 py-2.5 text-sm" :class="q.c === oi ? 'border-emerald-500' : 'border-ps-linha dark:border-ps-noite3'">
                <span class="h-7 w-7 rounded-full border-2 border-ps-linha dark:border-ps-noite3 inline-flex items-center justify-center text-xs font-bold" x-text="'ABCDE'.charAt(oi)"></span>
                <span class="flex-1" x-text="op || '[alternativa]'"></span>
                <span x-show="q.c === oi" class="text-xs font-bold text-emerald-700 dark:text-emerald-400">Correta</span>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </section>
  </div>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  var contadorPergunta = 0;
  function novaPergunta() { contadorPergunta++; return { k: contadorPergunta, p: '', o: ['', '', ''], c: 0 }; }
  function pagina() {
    return {
      previa: false, erros: {},
      f: { turma: param('t') || TURMAS[0].id, topico: '', titulo: '', descricao: '', pontos: 10 },
      perguntas: [novaPergunta()],
      init() {
        this.$store.ps.titulo = 'Editor de quiz';
        if (!this.$store.ps.turma(this.f.turma)) this.f.turma = TURMAS[0].id;
        this.f.topico = this.$store.ps.topicosDe(this.f.turma)[0] || '';
      },
      adicionar() { var self = this; this.perguntas.push(novaPergunta()); this.$nextTick(function () { var k = self.perguntas[self.perguntas.length - 1].k; var el = document.getElementById('p' + k); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } }); },
      duplicar(i) { var q = this.perguntas[i], n = novaPergunta(); n.p = q.p; n.o = q.o.slice(); n.c = q.c; this.perguntas.splice(i + 1, 0, n); },
      mover(i, d) { var l = this.perguntas.slice(), x = l[i]; l[i] = l[i + d]; l[i + d] = x; this.perguntas = l; },
      removerOpcao(q, oi) {
        if (q.o.length <= 2) return;
        q.o.splice(oi, 1);
        if (q.c === oi) q.c = 0; else if (q.c > oi) q.c--;
      },
      validar() {
        var e = {};
        if (!this.f.titulo.trim()) e.titulo = 1;
        if (!this.f.topico.trim()) e.topico = 1;
        this.perguntas.forEach(function (q, i) {
          var cheias = q.o.filter(function (o) { return o.trim(); }).length;
          if (!q.p.trim()) e['q' + i] = 'Escreva o enunciado.';
          else if (cheias < q.o.length) e['q' + i] = 'Preencha todas as alternativas ou remova as vazias.';
        });
        this.erros = e;
        return !Object.keys(e).length;
      },
      publicar() {
        if (!this.validar()) { var el = document.querySelector('[class*="border-red"]'); if (el) el.scrollIntoView({ block: 'center' }); return; }
        var item = {
          tipo: 'quiz', titulo: this.f.titulo.trim(), descricao: this.f.descricao.trim() || (this.perguntas.length + ' perguntas.'),
          pontos: Math.max(1, +this.f.pontos || 10),
          perguntas: this.perguntas.map(function (q) { return { p: q.p.trim(), o: q.o.map(function (o) { return o.trim(); }), c: q.c }; })
        };
        var id = this.$store.ps.criarAtividade(this.f.turma, this.f.topico.trim(), item);
        this.$store.ps.salvar();
        location.href = 'quiz.html?t=' + this.f.turma + '&id=' + id;
      }
    };
  }
</script>
</body>
</html>
