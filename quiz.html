<!doctype html>
<html lang="pt-BR" data-pagina="quiz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz | Sala PS</title>
<link rel="icon" type="image/png" href="img/logo-ps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw.js"></script>
<link rel="stylesheet" href="css/sala.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="pagina()" :class="$store.ps.menu && 'overflow-hidden lg:overflow-auto'" class="font-sans bg-ps-fundo text-ps-escuro dark:bg-ps-noite dark:text-slate-100 min-h-screen">

<main id="conteudo" class="pt-16 lg:pl-72 min-h-screen">
<template x-if="achado">
  <div class="px-4 sm:px-6 py-6 sm:py-10 max-w-3xl mx-auto">
    <a :href="'turma.html?t=' + achado.turma.id + '&aba=atividades'" class="inline-flex items-center gap-2 min-h-[44px] text-sm font-semibold text-ps-texto dark:text-ps-claro hover:underline">
      <span x-html="ic('voltar', '!w-4 !h-4')"></span><span x-text="achado.turma.nome"></span>
    </a>

    <!-- ================= Introdução ================= -->
    <section x-show="etapa === 'intro'" class="mt-4 rounded-3xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-6 sm:p-10 text-center">
      <span class="mx-auto h-16 w-16 rounded-2xl inline-flex items-center justify-center" :class="$store.ps.corTipo('quiz')" x-html="ic('quiz', '!w-8 !h-8')"></span>
      <h1 class="mt-5 text-2xl sm:text-3xl font-extrabold leading-tight" x-text="item.titulo"></h1>
      <p class="mt-3 text-[15px] leading-7 text-ps-cinza dark:text-slate-300" x-text="item.descricao"></p>
      <dl class="mt-8 grid grid-cols-3 gap-3 max-w-md mx-auto">
        <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-3"><dt class="text-xs text-ps-cinza dark:text-slate-400">Perguntas</dt><dd class="text-xl font-extrabold" x-text="item.perguntas.length"></dd></div>
        <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-3"><dt class="text-xs text-ps-cinza dark:text-slate-400">Pontos</dt><dd class="text-xl font-extrabold" x-text="item.pontos"></dd></div>
        <div class="rounded-xl bg-ps-suave dark:bg-ps-noite3 p-3"><dt class="text-xs text-ps-cinza dark:text-slate-400">Tempo</dt><dd class="text-xl font-extrabold">Livre</dd></div>
      </dl>
      <button type="button" @click="comecar()" class="mt-8 h-12 px-10 rounded-full text-[15px] font-bold bg-ps-azul text-ps-escuro inline-flex items-center gap-2 hover:brightness-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-ps-texto">
        Começar<span x-html="ic('direita', '!w-5 !h-5')"></span>
      </button>
    </section>

    <!-- ================= Perguntas ================= -->
    <section x-show="etapa === 'perguntas'" x-cloak class="mt-4">
      <div class="flex items-center justify-between gap-4 text-sm font-semibold">
        <span x-text="'Pergunta ' + (atual + 1) + ' de ' + item.perguntas.length"></span>
        <span class="text-ps-cinza dark:text-slate-400" x-text="respondidas() + ' respondidas'"></span>
      </div>
      <div class="mt-3 flex gap-1.5" aria-hidden="true">
        <template x-for="(q, i) in item.perguntas" :key="i">
          <span class="h-2 flex-1 rounded-full" :class="i === atual ? 'bg-ps-azul' : (respostas[i] !== undefined ? 'bg-ps-claro/60' : 'bg-ps-linha dark:bg-ps-noite3')"></span>
        </template>
      </div>

      <form class="mt-6 rounded-3xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-6 sm:p-8" @submit.prevent="avancar()">
        <fieldset>
          <legend class="text-xl sm:text-2xl font-extrabold leading-snug" x-text="pergunta().p"></legend>
          <div class="mt-6 flex flex-col gap-3">
            <template x-for="(op, oi) in pergunta().o" :key="atual + '-' + oi">
              <label class="flex items-center gap-4 min-h-[56px] px-4 py-3 rounded-2xl border-2 cursor-pointer text-[15px] transition-colors focus-within:ring-2 focus-within:ring-ps-azul focus-within:ring-offset-2 dark:focus-within:ring-offset-ps-noite2"
                     :class="respostas[atual] === oi ? 'border-ps-azul bg-ps-suave dark:bg-ps-noite3' : 'border-ps-linha dark:border-ps-noite3 hover:border-ps-claro'">
                <input type="radio" class="sr-only" :name="'q' + atual" :value="oi" :checked="respostas[atual] === oi" @change="marcar(oi)">
                <span class="h-8 w-8 rounded-full border-2 inline-flex items-center justify-center text-sm font-bold shrink-0"
                      :class="respostas[atual] === oi ? 'border-ps-azul bg-ps-azul text-ps-escuro' : 'border-ps-linha dark:border-ps-noite3'"
                      x-text="'ABCDE'.charAt(oi)"></span>
                <span x-text="op"></span>
              </label>
            </template>
          </div>
        </fieldset>
        <div class="mt-8 flex items-center justify-between gap-3">
          <button type="button" @click="atual--" :disabled="atual === 0" class="h-11 px-5 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-1 hover:bg-ps-fundo dark:hover:bg-ps-noite3 disabled:opacity-30 disabled:cursor-not-allowed">
            <span x-html="ic('esquerda', '!w-4 !h-4')"></span>Anterior
          </button>
          <button type="submit" :disabled="respostas[atual] === undefined || (ultima() && respondidas() < item.perguntas.length)"
                  class="h-11 px-6 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro inline-flex items-center gap-1 hover:brightness-105 disabled:opacity-40 disabled:cursor-not-allowed">
            <span x-text="ultima() ? 'Enviar respostas' : 'Próxima'"></span><span x-show="!ultima()" x-html="ic('direita', '!w-4 !h-4')"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- ================= Resultado ================= -->
    <section x-show="etapa === 'resultado'" x-cloak class="mt-4">
      <template x-if="resultado()">
        <div>
          <div class="rounded-3xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-6 sm:p-10 text-center">
            <p class="text-xs font-bold tracking-[1.5px] text-ps-texto dark:text-ps-claro">RESULTADO</p>
            <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold" x-text="item.titulo"></h1>
            <div class="mt-6 mx-auto h-36 w-36 rounded-full inline-flex flex-col items-center justify-center border-[10px]"
                 :class="resultado().acertos === resultado().total ? 'border-emerald-500' : 'border-ps-azul'">
              <span class="text-4xl font-extrabold" x-text="resultado().acertos + '/' + resultado().total"></span>
              <span class="text-xs text-ps-cinza dark:text-slate-400">acertos</span>
            </div>
            <p class="mt-5 text-lg font-semibold" x-text="'Nota: ' + $store.ps.fmt($store.ps.nota(item)) + ' de ' + item.pontos"></p>
            <p class="mt-1 text-sm text-ps-cinza dark:text-slate-400" x-text="'Enviado em ' + resultado().data"></p>
            <div class="mt-6 flex flex-wrap justify-center gap-3">
              <button type="button" @click="refazer()" class="h-11 px-6 rounded-full text-sm font-semibold border border-ps-linha dark:border-ps-noite3 inline-flex items-center gap-2 hover:bg-ps-fundo dark:hover:bg-ps-noite3"><span x-html="ic('restaurar', '!w-4 !h-4')"></span>Refazer</button>
              <a :href="'turma.html?t=' + achado.turma.id + '&aba=atividades'" class="h-11 px-6 rounded-full text-sm font-bold bg-ps-azul text-ps-escuro inline-flex items-center hover:brightness-105">Voltar à turma</a>
            </div>
          </div>

          <h2 class="mt-10 text-xl font-extrabold">Revisão</h2>
          <ol class="mt-4 flex flex-col gap-4">
            <template x-for="(q, qi) in item.perguntas" :key="qi">
              <li class="rounded-2xl border border-ps-linha dark:border-ps-noite3 bg-white dark:bg-ps-noite2 p-5">
                <div class="flex items-start gap-3">
                  <span class="h-7 w-7 rounded-full inline-flex items-center justify-center shrink-0"
                        :class="resultado().respostas[qi] === q.c ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'"
                        x-html="ic(resultado().respostas[qi] === q.c ? 'check' : 'x', '!w-4 !h-4')"></span>
                  <p class="font-semibold" x-text="(qi + 1) + '. ' + q.p"></p>
                </div>
                <ul class="mt-3 flex flex-col gap-2 sm:pl-10">
                  <template x-for="(op, oi) in q.o" :key="oi">
                    <li class="rounded-xl border px-4 py-2.5 text-sm flex items-center gap-2"
                        :class="oi === q.c ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-400/10' : (resultado().respostas[qi] === oi ? 'border-red-400 bg-red-50 dark:bg-red-400/10' : 'border-ps-linha dark:border-ps-noite3 opacity-70')">
                      <span class="flex-1" x-text="op"></span>
                      <span x-show="oi === q.c" class="text-xs font-bold text-emerald-700 dark:text-emerald-400">Correta</span>
                      <span x-show="oi !== q.c && resultado().respostas[qi] === oi" class="text-xs font-bold text-red-700 dark:text-red-400">Sua resposta</span>
                    </li>
                  </template>
                </ul>
              </li>
            </template>
          </ol>
        </div>
      </template>
    </section>
  </div>
</template>
</main>

<script src="js/dados.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
  function pagina() {
    return {
      id: param('id'), etapa: 'intro', atual: 0, respostas: [],
      get achado() { return this.$store.ps.achar(this.id); },
      get item() { return this.achado ? this.achado.item : null; },
      init() {
        var a = this.achado;
        if (!a) { location.replace('404.html'); return; }
        if (a.item.tipo !== 'quiz') { location.replace(this.$store.ps.urlItem(a.turma.id, a.item)); return; }
        this.$store.ps.turmaAtiva = a.turma.id;
        this.$store.ps.titulo = a.turma.nome;
        document.title = a.item.titulo + ' | Sala PS';
        if (this.$store.ps.quizzes[this.id]) this.etapa = 'resultado';
      },
      resultado() { return this.$store.ps.quizzes[this.id] || null; },
      pergunta() { return this.item.perguntas[this.atual]; },
      ultima() { return this.atual === this.item.perguntas.length - 1; },
      respondidas() { return this.respostas.filter(function (r) { return r !== undefined; }).length; },
      comecar() { this.respostas = []; this.atual = 0; this.etapa = 'perguntas'; window.scrollTo(0, 0); },
      marcar(oi) { var r = this.respostas.slice(); r[this.atual] = oi; this.respostas = r; },
      avancar() {
        if (this.respostas[this.atual] === undefined) return;
        if (!this.ultima()) { this.atual++; return; }
        var acertos = this.$store.ps.enviarQuiz(this.item, this.respostas);
        this.etapa = 'resultado';
        window.scrollTo(0, 0);
        this.$store.ps.avisar('Quiz enviado: ' + acertos + ' de ' + this.item.perguntas.length + '.');
      },
      refazer() { this.$store.ps.refazerQuiz(this.id); this.comecar(); }
    };
  }
</script>
</body>
</html>
